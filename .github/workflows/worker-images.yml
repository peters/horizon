name: Worker images

# Publishes ghcr.io/peters/horizon-worker-helpers: the worker helpers and scripts of
# one main commit, for recipes to copy with COPY --from, pinned by digest, and
# ghcr.io/peters/horizon-worker-base: the public CPU base worker built from those
# helpers, which quick start runs a repository without its own image on. Each image
# is an index for linux/amd64 and linux/arm64. A runner of each architecture builds
# and checks its image without emulation and pushes it under its own tag; then one
# job joins the two into the index. Only main publishes. A pull request that changes
# the image recipes builds and checks both architectures and pushes nothing.
on:
  push:
    branches: [main]
    # The three helper crates and every workspace crate they depend on.
    paths:
      - examples/cloud-worker/**
      - crates/horizon-cloud-worker/**
      - crates/horizon-device/**
      - crates/horizon-browser-cli/**
      - crates/horizon-browser/**
      - crates/horizon-browser-control/**
      - crates/horizon-browser-mcp/**
      - crates/horizon-browser-protocol/**
      - crates/horizon-cloud/**
      - crates/horizon-cloud-protocol/**
      - crates/horizon-process-time/**
      - Cargo.toml
      - Cargo.lock
      # The image ships the license and the dependency notices this collector gathers.
      - LICENSE
      - .horizon/collect-helper-notices.py
      - .github/workflows/worker-images.yml
  # Only the recipes and their scripts; the main CI tests the helper crates.
  pull_request:
    paths:
      - examples/cloud-worker/**
      - .horizon/collect-helper-notices.py
      - .github/workflows/worker-images.yml
  workflow_dispatch:

# A running publication always finishes; GitHub keeps only the newest waiting run.
# A newer push to a pull request cancels the check of the earlier push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Build and check (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Each architecture sets only its own output.
    outputs:
      report_amd64: ${{ steps.base.outputs.report_amd64 }}
      report_arm64: ${{ steps.base.outputs.report_arm64 }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      REVISION: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build and check helpers
        run: examples/cloud-worker/build-helpers-image.sh "$REVISION" horizon-worker-helpers:check
      - name: Build and check CPU base worker
        id: base
        run: |
          examples/cloud-worker/build-base-image.sh horizon-worker-helpers:check horizon-worker-base:check \
            | tee "$RUNNER_TEMP/build.log"
          {
            echo "report_$ARCH<<report_end"
            sed -n '/^Worker check report for the quick-start capabilities:$/,/^End of the worker check report\.$/p' \
              "$RUNNER_TEMP/build.log" | sed '1d;$d'
            echo report_end
          } >> "$GITHUB_OUTPUT"
      # The worker check only asks the browser for its version; this renders a page.
      - name: Render a page in Chromium
        run: |
          page=$(docker run --rm --network=none --entrypoint /bin/sh horizon-worker-base:check -c \
            'browser=$(command -v google-chrome-stable || command -v chromium) &&
             "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
               --dump-dom "data:text/html,<p>worker-page</p>"')
          grep -q '<p>worker-page</p>' <<< "$page"

  check-report:
    name: Compare worker check reports
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    defaults:
      run:
        shell: bash
    env:
      AMD64: ${{ needs.check.outputs.report_amd64 }}
      ARM64: ${{ needs.check.outputs.report_arm64 }}
    steps:
      # Quick start keeps one report beside the pin of the index, so both architectures
      # must report the same markers.
      - name: Compare
        run: |
          test -n "$AMD64"
          diff <(printf '%s\n' "$AMD64") <(printf '%s\n' "$ARM64")

  helpers:
    name: Publish worker helpers (${{ matrix.arch }})
    if: github.repository == 'peters/horizon' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    strategy:
      # A cancelled leg could stop after its push; its tag would block a re-run.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Each architecture sets only its own output.
    outputs:
      digest_amd64: ${{ steps.publish.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.publish.outputs.digest_arm64 }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/peters/horizon-worker-helpers
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing is pushed unless every current marker is present.
      - name: Build and check
        run: examples/cloud-worker/build-helpers-image.sh "$REVISION" "$IMAGE:sha-$REVISION-$ARCH"
      - name: Publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          examples/cloud-worker/registry-tag.sh require-absent "$IMAGE:sha-$REVISION-$ARCH"
          docker push "$IMAGE:sha-$REVISION-$ARCH" | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -n 1 | cut -d' ' -f2)
          test -n "$digest"
          echo "digest_$ARCH=$digest" >> "$GITHUB_OUTPUT"

  helpers-index:
    name: Publish worker helpers index
    needs: helpers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/peters/horizon-worker-helpers
      REVISION: ${{ github.sha }}
      AMD64: ${{ needs.helpers.outputs.digest_amd64 }}
      ARM64: ${{ needs.helpers.outputs.digest_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$AMD64"
          test -n "$ARM64"
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          examples/cloud-worker/registry-tag.sh require-absent "$IMAGE:sha-$REVISION"
          docker buildx imagetools create --tag "$IMAGE:sha-$REVISION" --tag "$IMAGE:main" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(examples/cloud-worker/registry-tag.sh digest "$IMAGE:sha-$REVISION")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "Published \`$IMAGE:sha-$REVISION\` and \`$IMAGE:main\` for linux/amd64 and linux/arm64."
            echo
            echo "Copy it into a worker recipe with:"
            echo
            echo "\`COPY --from=$IMAGE@$digest / /\`"
          } >> "$GITHUB_STEP_SUMMARY"

  base:
    name: Publish CPU base worker (${{ matrix.arch }})
    needs: helpers-index
    strategy:
      # A cancelled leg could stop after its push; its tag would block a re-run.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    # Each architecture sets only its own outputs.
    outputs:
      digest_amd64: ${{ steps.publish.outputs.digest_amd64 }}
      digest_arm64: ${{ steps.publish.outputs.digest_arm64 }}
      report_amd64: ${{ steps.build.outputs.report_amd64 }}
      report_arm64: ${{ steps.build.outputs.report_arm64 }}
    defaults:
      run:
        shell: bash
    env:
      ARCH: ${{ matrix.arch }}
      IMAGE: ghcr.io/peters/horizon-worker-base
      HELPERS: ghcr.io/peters/horizon-worker-helpers@${{ needs.helpers-index.outputs.digest }}
      REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pull takes the helpers of this runner's architecture from the index. The
      # script builds the generic recipe over them, then checks the worker contract and
      # that no layer has SSH host keys. Nothing is pushed if a check fails.
      - name: Build and check
        id: build
        run: |
          docker pull "$HELPERS"
          examples/cloud-worker/build-base-image.sh "$HELPERS" "$IMAGE:sha-$REVISION-cpu-$ARCH" \
            | tee "$RUNNER_TEMP/build.log"
          {
            echo "report_$ARCH<<report_end"
            sed -n '/^Worker check report for the quick-start capabilities:$/,/^End of the worker check report\.$/p' \
              "$RUNNER_TEMP/build.log" | sed '1d;$d'
            echo report_end
          } >> "$GITHUB_OUTPUT"
      - name: Publish
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          examples/cloud-worker/registry-tag.sh require-absent "$IMAGE:sha-$REVISION-cpu-$ARCH"
          docker push "$IMAGE:sha-$REVISION-cpu-$ARCH" | tee "$RUNNER_TEMP/push.log"
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -n 1 | cut -d' ' -f2)
          test -n "$digest"
          echo "digest_$ARCH=$digest" >> "$GITHUB_OUTPUT"

  # The package is public, so workers pull it without a registry login. Quick start
  # uses the index digest that a Horizon commit pins, never the moving cpu tag; each
  # Docker engine takes the image of its own architecture from the index.
  base-index:
    name: Publish CPU base worker index
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    env:
      IMAGE: ghcr.io/peters/horizon-worker-base
      REVISION: ${{ github.sha }}
      AMD64: ${{ needs.base.outputs.digest_amd64 }}
      ARM64: ${{ needs.base.outputs.digest_arm64 }}
      REPORT_AMD64: ${{ needs.base.outputs.report_amd64 }}
      REPORT_ARM64: ${{ needs.base.outputs.report_arm64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$AMD64"
          test -n "$ARM64"
          # Quick start keeps one report beside the pin, so both architectures must
          # report the same markers.
          test -n "$REPORT_AMD64"
          diff <(printf '%s\n' "$REPORT_AMD64") <(printf '%s\n' "$REPORT_ARM64")
          printf '%s\n' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          examples/cloud-worker/registry-tag.sh require-absent "$IMAGE:sha-$REVISION-cpu"
          docker buildx imagetools create --tag "$IMAGE:sha-$REVISION-cpu" --tag "$IMAGE:cpu" \
            "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(examples/cloud-worker/registry-tag.sh digest "$IMAGE:sha-$REVISION-cpu")
          {
            echo "Published \`$IMAGE:sha-$REVISION-cpu\` and \`$IMAGE:cpu\` for linux/amd64 and linux/arm64."
            echo
            echo "To make quick start use this image, set the pin in"
            echo "\`crates/horizon-core/src/cloud_runtime/repository/launch/quick_start.rs\` to:"
            echo
            echo "\`$IMAGE@$digest\`"
            echo
            echo "Set \`CONTRACT\` there to the worker check report of both architectures:"
            echo
            echo '```'
            printf '%s\n' "$REPORT_AMD64"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
