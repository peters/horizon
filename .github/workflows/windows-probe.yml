name: Windows test probe

# Temporary measurement run for #841. Deleted with its branch.
on:
  push:
    branches: [ci/windows-test-probe]

# Identical to ci.yml so rust-cache's environment hash matches main's entry.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Same job id and key as ci.yml's Windows job so rust-cache restores main's entry.
  windows-smoke:
    name: Windows full test run
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-test-build
          save-if: false
      - name: Report rust-cache status
        shell: bash
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - run: cargo test --locked --workspace --no-run
      - name: Run workspace tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked --workspace --no-fail-fast 2>&1 | tee workspace-tests.log
      - name: Diagnostics
        if: always()
        shell: bash
        run: |
          {
            cargo test --locked -p horizon-core --lib agent_work::store::tests::panel_paths_preserve_identity_on_case_insensitive_filesystems -- --exact --nocapture || true
            cargo test --locked -p horizon-core --lib runtime_state::tests::remote_references::remote_views_never_execute_saved_commands_on_restore_or_restart -- --exact --nocapture || true
            cargo test --locked -p horizon-browser-routines --lib registry::tests::save_load_list_and_delete_round_trip -- --exact --nocapture || true
            for attempt in 1 2 3; do
              echo "== handoff attempt $attempt"
              cargo test --locked -p horizon-browser-mcp --test workspace_scope browser_handoff -- --nocapture || true
            done
          } 2>&1 | tee diagnostics.log
      - name: Summarize failures
        if: always()
        shell: bash
        run: |
          grep -E '^test .* FAILED$|^test result:' workspace-tests.log || true
          grep -E 'DIAG|panicked|test result' diagnostics.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-workspace-tests
          path: |
            workspace-tests.log
            diagnostics.log
