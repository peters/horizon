name: Windows test probe

# Temporary measurement run for #841. Deleted with its branch.
on:
  push:
    branches: [ci/windows-test-probe]

# Identical to ci.yml so rust-cache's environment hash matches main's entry.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # Same job id and key as ci.yml's Windows job so rust-cache restores main's entry.
  windows-smoke:
    name: Windows full test run
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-test-build
          save-if: false
      - name: Report rust-cache status
        shell: bash
        run: echo "cache-hit=${{ steps.rust-cache.outputs.cache-hit }}"
      - name: Stress manifest-polling tests
        shell: bash
        run: |
          cargo test --locked -p horizon-browser-cli --test cli --no-run
          cargo test --locked -p horizon-browser-mcp --test workspace_scope --no-run
          {
            for attempt in $(seq 1 15); do
              echo "== cli attempt $attempt"
              cargo test --locked -p horizon-browser-cli --test cli 2>&1 | grep -E "FAILED|panicked|DIAG|test result" || true
              echo "== mcp attempt $attempt"
              cargo test --locked -p horizon-browser-mcp --test workspace_scope -- --nocapture 2>&1 | grep -E "FAILED|panicked|DIAG|test result" || true
            done
          } 2>&1 | tee stress.log
      - name: Summarize
        if: always()
        shell: bash
        run: grep -E "FAILED|DIAG stderr|isError\":true|never appeared" stress.log | sort | uniq -c | sort -rn | head -40 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-workspace-tests
          path: stress.log
