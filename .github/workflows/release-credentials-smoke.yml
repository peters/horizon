name: Verify Release Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-app:
    name: Verify scoped App credential (${{ matrix.repository }})
    runs-on: ubuntu-latest
    environment: release-automation
    strategy:
      fail-fast: false
      matrix:
        repository: [homebrew-horizon, horizon-updates, winget-pkgs]
    steps:
      - name: Mint destination credential
        id: credential
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: peters
          repositories: ${{ matrix.repository }}
          permission-contents: write
      - name: Verify selected repository
        env:
          GH_TOKEN: ${{ steps.credential.outputs.token }}
          EXPECTED_REPOSITORY: peters/${{ matrix.repository }}
        run: |
          gh api installation/repositories |
            jq --exit-status --arg expected "$EXPECTED_REPOSITORY" \
              '.total_count == 1 and (.repositories | map(.full_name)) == [$expected]'
          gh api "repos/$EXPECTED_REPOSITORY" --jq .full_name

  verify-public-pr-token:
    name: Verify public-only PR credential
    runs-on: ubuntu-latest
    environment: release-automation
    steps:
      - name: Verify owner and exact scope without displaying the credential
        env:
          GH_TOKEN: ${{ secrets.WINGET_PUBLIC_PR_TOKEN }}
        shell: python
        run: |
          import json, os, urllib.request
          request = urllib.request.Request(
              'https://api.github.com/user',
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'User-Agent': 'release-credential-check'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              identity = json.load(response)
              scopes = response.headers.get('X-OAuth-Scopes', '')
              expiry = response.headers.get('GitHub-Authentication-Token-Expiration', '')
          assert identity['login'] == 'peters', 'Unexpected public PR identity'
          assert scopes == 'public_repo', 'Unexpected public PR token scope'
          assert expiry, 'Public PR token must expire'
          print('Verified peters, public_repo only, expires ' + expiry)
      - name: Verify upstream repository access
        env:
          GH_TOKEN: ${{ secrets.WINGET_PUBLIC_PR_TOKEN }}
        run: gh api repos/microsoft/winget-pkgs --jq .full_name
