name: Claude Review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read

# A new run waits for the current one and never cancels it, so the label stays
# until its own run removes it and two runs cannot count the same free round.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    uses: fintermobilityas/review/.github/workflows/claude-review.yml@f4dc32e3550a23b2e866f1b9aade2f83d80d5c28
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    # The called workflow reads ANTHROPIC_API_KEY, the organization secret.
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
