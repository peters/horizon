name: Claude Review

# Claude reviews a pull request at most 2 times, in the policy of
# fintermobilityas/company (docs/pull-requests.md). Round 1 starts when a pull
# request opens or leaves draft. Round 2, and every review of a fork's pull
# request, starts only when a maintainer adds the `claude-review` label.
#
# Keep this file identical in every repository and change the review itself in
# fintermobilityas/company/.github/workflows/claude-review-shared.yml, which
# this file calls.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read

# A new run waits for the current one and never cancels it, so the label stays
# until its own run removes it and two runs cannot count the same free round.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    uses: fintermobilityas/review/.github/workflows/claude-review.yml@main
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    # The called workflow reads ANTHROPIC_API_KEY, the organization secret.
    secrets: inherit
