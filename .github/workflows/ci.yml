name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Dev and test builds keep line tables only: a panic backtrace still names
  # its file and line, while the dropped variable and type DWARF (and the
  # matching Windows PDB payload) cuts link time on every lane and shrinks
  # what each rust-cache entry stores. Cache size is not cosmetic here - the
  # repository sits at GitHub's 10 GB budget, where each save evicts main's
  # entries and leaves the next job to build cold. Local builds are untouched.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Cache policy: every rust-cache step below sets
# `save-if: github.ref == 'refs/heads/main'`. Pull-request runs restore from
# main's entry but never write their own. A per-branch copy of each build
# cache pushed the repository past GitHub's 10 GB budget, and the resulting
# eviction of the main entries left cold jobs to time out.
# Keys keep the default lock-aware suffix (do not set
# `add-rust-environment-hash-key: false`): GitHub cache entries are immutable,
# so a stable key freezes the entry at its first save and every later lock
# bump re-downloads its new dependencies on every run. A lock bump costs one
# cold build per lane until the next main run saves the new entry, which is
# the cheaper tradeoff here. The Report rust-cache status steps surface
# HIT/MISS from the action's cache-hit output in the job summary.
# Entry count is part of the budget: jobs that build the same graph share one
# runner (the three Clippy tiers, both browser-engine feature sets) instead of
# keeping a near-duplicate cache each.
jobs:
  # The small ubuntu checks share one runner instead of seven parallel
  # one-job runners: each finishes in well under a minute, so the fan-out
  # mostly lengthens the GitHub-hosted queue. Keep new small checks here as
  # steps; give a check its own job only when it needs a different runner
  # or cache. See #677.
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_snap_build: ${{ steps.changes.outputs.run_snap_build }}
      release_inputs: ${{ steps.changes.outputs.release_inputs }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - name: Format
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: Verify Ubuntu dependency installer
        run: python3 -B scripts/test_install_ci_ubuntu_dependencies.py -v
      - name: Verify GitHub release orchestration
        run: python3 -B scripts/test_release_github.py -v
      - name: Verify Surge dependency updates
        run: |
          python3 -B scripts/test_check_surge_dependency.py -v
          python3 -B scripts/check_surge_dependency.py
      - name: Isolated desktop session bus
        run: python3 -B -m unittest discover -s scripts/device-smoke/tests -v
      - name: Maintainability
        run: ./scripts/check-maintainability.sh
      - name: Version Sync
        run: ./scripts/check-version-sync.sh
      - name: Browser client dependency boundary
        run: python3 scripts/check-browser-client-dependencies.py
      - name: Verify CI change detection
        run: python3 -B scripts/test_detect_ci_build_inputs.py -v
      # One diff answers both gated lanes: Snap packaging and the release
      # Artifacts matrix. This job already checks out full history, so the
      # Artifacts gate costs nothing here instead of a second runner and a
      # second full clone. The classification lives in a script with its own
      # test suite (run above) because a silent misclassification skips a
      # release build.
      - id: changes
        name: Detect packaging and release inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/detect-ci-build-inputs.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # Both feature sets share one runner: each finished in well under a minute,
  # the boundary and geometry checks above them are identical, and a second
  # matrix leg bought a duplicate cache entry for a near-identical graph.
  browser-engine:
    name: Browser engine
    runs-on: ubuntu-latest
    # Two sequential feature sets, with headroom for a cold cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: browser-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify dependency boundary
        run: python3 scripts/check-browser-engine-dependencies.py
      - name: Test remote click geometry
        run: node --test scripts/browser-smoke/remote_click_geometry.test.cjs
      - name: Test and lint standalone engine
        run: |
          for engine_features in "" video-capture; do
            selected=()
            if [ -n "$engine_features" ]; then
              selected=(--features "$engine_features")
            fi
            cargo test --locked -p horizon-browser --no-default-features "${selected[@]}"
            cargo clippy --locked -p horizon-browser --all-targets --no-default-features "${selected[@]}" -- -D warnings
          done

  device:
    name: Device library and CLI/MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: device
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/install-ci-ubuntu-dependencies.sh libxkbcommon-dev libwayland-dev pkg-config xvfb xauth bubblewrap
      - name: Isolated desktop session bus
        run: python3 -B -m unittest discover -s scripts/device-smoke/tests -v
      - run: cargo test --locked -p horizon-device
      - run: cargo test --locked -p horizon-device --features cli
      - run: cargo test --locked -p horizon-device-vnc
      - run: cargo build --locked -p horizon-device-vnc
      - run: python3 scripts/device-smoke/resize_permission.py --binary target/debug/horizon-device-vnc
      - run: cargo clippy --locked -p horizon-device-vnc --all-targets -- -D warnings
      - name: Qualify pinned VNC decoder
        run: |
          decoder_dir=$(mktemp -d)
          decoder_rev=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["vnc"]["rev"])')
          git -C "$decoder_dir" init
          git -C "$decoder_dir" fetch --depth 1 https://github.com/peters/vnc-rs.git "$decoder_rev"
          git -C "$decoder_dir" checkout --detach FETCH_HEAD
          cargo fmt --manifest-path "$decoder_dir/Cargo.toml" -- --check
          cargo test --manifest-path "$decoder_dir/Cargo.toml"
          cargo clippy --manifest-path "$decoder_dir/Cargo.toml" --all-targets -- -D warnings
      - run: cargo clippy --locked -p horizon-device --all-targets --features cli -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - run: cargo package --locked -p horizon-device --features cli
      - name: Native input lifecycle
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -extension MIT-SHM' bash -eu -c '
            device_test_dir=$(mktemp -d)
            trap '\''rm -rf "$device_test_dir"'\'' EXIT
            printf '\''{"id":"ci-device","endpoint":{"kind":"local_x11","display":"%s"}}'\'' "$DISPLAY" > "$device_test_dir/target.json"
            HORIZON_DEVICE_TEST_TARGET="$device_test_dir/target.json" cargo test --locked -p horizon-device --features cli --lib --test x11_live --test cli -- --ignored --test-threads=1
            python3 scripts/device-smoke/resize_lifecycle.py --binary target/debug/horizon-device-vnc --target "$device_test_dir/target.json"
          '

  browser-harness-tests:
    name: Browser harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify remote browser spike transport rules
        run: python3 -B -m unittest discover -s scripts/remote-browser-spike/tests -v


  # The three lint tiers share one runner and one cache. Each tier took well
  # under a minute on its own yet kept a separate half-gigabyte cache entry of
  # a nearly identical dependency graph. `!cancelled()` keeps every tier
  # reporting in one run, so a blocking failure still shows the strict and
  # pedantic results the way three jobs used to.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    # Three sequential tiers, with headroom for a cold cache: the first tier
    # then compiles the vendored speech C++ tree before it can lint.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: rustup component add clippy
      # `speech` (CPU) is the widest feature set a plain runner can build:
      # speech-cuda needs nvcc and speech-vulkan the Vulkan SDK, and their
      # Rust surface is identical to `speech` (they only toggle native
      # backends). cpal needs the ALSA headers on Linux.
      - run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - name: Blocking tier
        run: cargo clippy --locked --all-targets --features speech,trace-profiling -- -D warnings
      # `--features speech` so the unwrap/expect ban also covers the speech
      # runtime code.
      - name: Strict tier
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --lib --bins --examples --features speech -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Pedantic tier (advisory)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked --workspace --all-targets --features speech -- -D warnings -W clippy::pedantic || {
            echo "::warning::Pedantic lint debt detected (non-blocking advisory tier)."
          }

  rust-test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Headroom for a cold cache. A lock bump, toolchain bump, or eviction
    # rebuilds the vendored speech C++ tree, and a job that times out skips
    # the cache save, so the next run starts cold again.
    timeout-minutes: 35
    strategy:
    # A failing OS releases the other runner instead of holding it to the
    # full timeout; the cancelled sibling keeps its logs and a re-run
    # recovers the complete per-OS signal. See #677.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-test
          - os: macos-latest
            name: macOS arm64
            cache_key: macos-test
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Link the Swift runtime in macOS test binaries
        if: startsWith(matrix.os, 'macos-')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,-rpath,/usr/lib/swift" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace
      # `speech` is declared by horizon-ui alone, so every other crate builds
      # identically with and without it and a second `--workspace` pass only
      # re-ran their suites (about a minute per OS). The feature pass runs the
      # crate that owns the gated code - capture, resampler, shortcut matchers
      # and the engine state machine - and links the native audio backend
      # (ALSA / CoreAudio) on each OS in the matrix; the no-mic and real-model
      # paths stay env-gated off. horizon-core's speech config and GGUF reader
      # are not feature-gated and run in the workspace pass above.
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - run: cargo test --locked -p horizon-ui --features speech

  windows-smoke:
    name: Windows test build
    runs-on: windows-latest
    # Headroom for a cold cache: a cacheless run passed 15 minutes while
    # still compiling the vendored speech C++ tree, and a timed-out job
    # skips the cache save, so the next run starts cold again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-test-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: cargo test --locked --workspace --no-run
      - name: Execute durable publication regression
        run: cargo test --locked -p horizon-browser-cli --test cli run_publishes_a_complete_relative_job_when_home_is_unset -- --exact
      # The speech feature is advertised on Windows too (WASAPI capture via
      # cpal); build it so a Windows-only break cannot pass CI. Compiling the
      # vendored C++ tree here is the point — tests are not run. horizon-ui
      # owns the feature, so the rest of the workspace is already built by the
      # pass above.
      - run: cargo test --locked -p horizon-ui --features speech --no-run


  snap-build:
    name: Snap Build
    needs: repo-checks
    # Disabled: Snap packaging paused. Re-enable by restoring the previous
    # condition: needs.repo-checks.outputs.run_snap_build == 'true'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: .
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: horizon-linux-x64.snap
          path: ${{ steps.snapcraft.outputs.snap }}

  # Docs/CI-only pushes to main must not pay for four release builds, so the
  # matrix is gated on the paths that can change the binary, as detected by
  # Repo checks. A workflow dispatch always builds, even when those checks
  # fail, so a release can still be forced on demand.
  rust-artifacts:
    name: Artifacts (${{ matrix.name }})
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.repo-checks.outputs.release_inputs == 'true'))
    needs: repo-checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-artifacts
            release_asset: horizon-linux-x64.tar.gz
            binary_path: target/release/horizon
            asset_kind: tar
          - os: macos-latest
            name: macOS arm64
            cache_key: macos-artifacts
            release_asset: horizon-osx-arm64.tar.gz
            binary_path: target/release/horizon
            asset_kind: tar
          - os: macos-15-intel
            name: macOS x64
            cache_key: macos-intel-artifacts
            release_asset: horizon-osx-x64.tar.gz
            binary_path: target/release/horizon
            asset_kind: tar
          - os: windows-latest
            name: Windows x64
            cache_key: windows-artifacts
            release_asset: horizon-windows-x64.exe
            binary_path: target/release/horizon.exe
            asset_kind: file
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: cargo build --locked --release
      - name: Package release asset
        shell: bash
        run: |
          ./scripts/package-release-asset.sh \
            --binary "${{ matrix.binary_path }}" \
            --kind "${{ matrix.asset_kind }}" \
            --output "${{ matrix.release_asset }}"
      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_asset }}
          path: ${{ matrix.release_asset }}
