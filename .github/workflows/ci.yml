name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each push to main gets its own group. With a shared group, GitHub keeps only one
# pending run, so when merges land close together the run of a middle merge is
# dropped, and the next run diffs only its own push and can skip that merge's
# Snap and release builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Dev and test builds keep line tables only: a panic backtrace still names
  # its file and line, while the dropped variable and type DWARF cuts link
  # time on every lane and shrinks what each rust-cache entry stores. Cache
  # size is not cosmetic here - the repository sits at GitHub's 10 GB budget,
  # where each save evicts main's entries and leaves the next job to build
  # cold. Local builds are untouched.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

# Cache policy: every rust-cache step below and in release-artifacts.yml
# sets `save-if: github.ref == 'refs/heads/main'`. The platform test jobs also
# require one saver per OS (`matrix.save_cache` on Linux and macOS), so each OS
# keeps one entry.
# Pull-request runs restore from main's entry but never write their own.
# A per-branch copy of each build
# cache pushed the repository past GitHub's 10 GB budget, and the resulting
# eviction of the main entries left cold jobs to time out.
# Keys keep the default lock-aware suffix (do not set
# `add-rust-environment-hash-key: false`): GitHub cache entries are immutable,
# so a stable key freezes the entry at its first save and every later lock
# bump re-downloads its new dependencies on every run. A lock bump costs one
# cold build per lane until the next main run saves the new entry, which is
# the cheaper tradeoff here. The Report rust-cache status steps surface
# HIT/MISS from the action's cache-hit output in the job summary.
# Entry count is part of the budget: jobs that build the same graph share one
# runner (the three Clippy tiers, both browser-engine feature sets) instead of
# keeping a near-duplicate cache each.
# The two macOS release Artifacts entries save about once a night (see
# macos-release-builds.yml), not on every merge. Eviction between nights
# makes that build cold, which still fits its timeout.
jobs:
  # The small ubuntu checks share one runner instead of seven parallel
  # one-job runners: each finishes in well under a minute, so the fan-out
  # mostly lengthens the GitHub-hosted queue. Keep new small checks here as
  # steps; give a check its own job only when it needs a different runner
  # or cache. See #677.
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - name: Format
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: Verify Ubuntu dependency installer
        run: python3 -B scripts/test_install_ci_ubuntu_dependencies.py -v
      - name: Verify GitHub release orchestration
        run: python3 -B scripts/test_release_github.py -v
      - name: Verify worker helper license provenance
        run: |
          python3 -B .horizon/test_collect_helper_notices.py -v
          python3 -O -B .horizon/test_collect_helper_notices.py -v
      - name: Isolated desktop session bus
        run: python3 -B -m unittest discover -s scripts/device-smoke/tests -v
      - name: Casting benchmark integrity
        run: |
          cast_bench_venv=$(mktemp -d "$RUNNER_TEMP/cast-bench.XXXXXX")
          python3 -m venv "$cast_bench_venv"
          "$cast_bench_venv/bin/pip" install --disable-pip-version-check -r auto/cast/requirements.txt
          "$cast_bench_venv/bin/python" -B -m unittest discover -s auto/cast -p 'test_*.py' -v
      - name: Horizon MCP skill coverage
        run: python3 -B scripts/check-horizon-mcp-skills.py
      - name: Maintainability
        run: ./scripts/check-maintainability.sh
      - name: Version Sync
        run: ./scripts/check-version-sync.sh
      - name: Browser client dependency boundary
        run: python3 scripts/check-browser-client-dependencies.py
      - name: Verify CI change detection
        run: python3 -B scripts/test_detect_ci_build_inputs.py -v
      - name: Verify the nightly macOS release builds watcher
        run: python3 -B scripts/test_nightly_release_watch.py -v
      - name: Verify the PR readiness check
        run: python3 -B scripts/test_check_pr_readiness.py -v
      - name: Verify platform test shards
        run: python3 -B scripts/test_ci_cargo_test_shard.py -v
      - name: Verify the test focus helper
        run: python3 -B scripts/test_test_focus.py -v
      - name: Verify the setup gate runner
        run: python3 -B scripts/test_setup_gate.py -v

  # One diff answers every gated lane: Snap packaging, the release Artifacts
  # builds and, on pull requests, the Rust build and test jobs and the Linux
  # speech tests. It runs on its own small runner so the Rust jobs wait
  # seconds for it, not for every repo check. The classification lives in a
  # script with its own test suite (run in Repo checks) because a silent
  # misclassification skips a build.
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_snap_build: ${{ steps.changes.outputs.run_snap_build }}
      release_inputs: ${{ steps.changes.outputs.release_inputs }}
      macos_release_inputs: ${{ steps.changes.outputs.macos_release_inputs }}
      rust_inputs: ${{ steps.changes.outputs.rust_inputs }}
      speech_inputs: ${{ steps.changes.outputs.speech_inputs }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        name: Detect packaging, release and Rust inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/detect-ci-build-inputs.sh "$EVENT_NAME" "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # Both feature sets share one runner: each finished in well under a minute,
  # the boundary and geometry checks above them are identical, and a second
  # matrix leg bought a duplicate cache entry for a near-identical graph.
  browser-engine:
    name: Browser engine
    needs: changes
    # A pull request that changes only documentation or other workflows skips
    # this job (see Detect changed inputs). Anything but an explicit false runs
    # it: when that job fails, its output is empty and this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.rust_inputs != 'false' }}
    runs-on: ubuntu-latest
    # Two sequential feature sets, with headroom for a cold cache.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: browser-engine
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify dependency boundary
        run: python3 scripts/check-browser-engine-dependencies.py
      - name: Test browser script regressions
        run: node --test scripts/browser-smoke/*.test.cjs
      - name: Install video assembler
        if: ${{ !env.LOCALCI }}
        run: bash scripts/install-ci-video-build-tools.sh
      - name: Test and lint standalone engine
        run: |
          for engine_features in "" video-capture; do
            selected=()
            if [ -n "$engine_features" ]; then
              selected=(--features "$engine_features")
            fi
            cargo test --locked -p horizon-browser --no-default-features "${selected[@]}"
            cargo clippy --locked -p horizon-browser --all-targets --no-default-features "${selected[@]}" -- -D warnings
          done

  device:
    name: Device library and CLI/MCP
    needs: changes
    # A pull request that changes only documentation or other workflows skips
    # this job (see Detect changed inputs). Anything but an explicit false runs
    # it: when that job fails, its output is empty and this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.rust_inputs != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: device
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - if: ${{ !env.LOCALCI }}
        run: bash scripts/install-ci-ubuntu-dependencies.sh libxkbcommon-dev libwayland-dev pkg-config xvfb xauth bubblewrap
      - name: Isolated desktop session bus
        run: python3 -B -m unittest discover -s scripts/device-smoke/tests -v
      - run: cargo test --locked -p horizon-device
      - run: cargo test --locked -p horizon-device --features cli
      - run: cargo test --locked -p horizon-device-vnc
      - run: cargo build --locked -p horizon-device-vnc
      - run: python3 scripts/device-smoke/resize_permission.py --binary target/debug/horizon-device-vnc
      - run: cargo clippy --locked -p horizon-device-vnc --all-targets -- -D warnings
      - name: Qualify pinned VNC decoder
        run: |
          decoder_dir=$(mktemp -d)
          decoder_rev=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["dependencies"]["vnc"]["rev"])')
          git -C "$decoder_dir" init
          git -C "$decoder_dir" fetch --depth 1 https://github.com/peters/vnc-rs.git "$decoder_rev"
          git -C "$decoder_dir" checkout --detach FETCH_HEAD
          cargo fmt --manifest-path "$decoder_dir/Cargo.toml" -- --check
          cargo test --manifest-path "$decoder_dir/Cargo.toml"
          cargo clippy --manifest-path "$decoder_dir/Cargo.toml" --all-targets -- -D warnings
      - run: cargo clippy --locked -p horizon-device --all-targets --features cli -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - run: cargo package --locked -p horizon-device --features cli
      - name: Native input lifecycle
        run: |
          # Without -noreset, Xvfb resets when its last client disconnects, and it closes a
          # client that connects during the reset with ECONNRESET. Each test connects anew.
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -extension MIT-SHM -noreset' bash -eu -c '
            device_test_dir=$(mktemp -d)
            trap '\''rm -rf "$device_test_dir"'\'' EXIT
            printf '\''{"id":"ci-device","endpoint":{"kind":"local_x11","display":"%s"}}'\'' "$DISPLAY" > "$device_test_dir/target.json"
            HORIZON_DEVICE_TEST_TARGET="$device_test_dir/target.json" cargo test --locked -p horizon-device --features cli --lib --test x11_live --test cli -- --ignored --test-threads=1
            python3 scripts/device-smoke/resize_lifecycle.py --binary target/debug/horizon-device-vnc --target "$device_test_dir/target.json"
          '

  browser-harness-tests:
    name: Browser harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify remote browser spike transport rules
        run: python3 -B -m unittest discover -s scripts/remote-browser-spike/tests -v


  # The three lint tiers share one runner and one cache. Each tier took well
  # under a minute on its own yet kept a separate half-gigabyte cache entry of
  # a nearly identical dependency graph. `!cancelled()` keeps every tier
  # reporting in one run, so a blocking failure still shows the strict and
  # pedantic results the way three jobs used to.
  clippy:
    name: Clippy
    needs: changes
    # A pull request that changes only documentation or other workflows skips
    # this job (see Detect changed inputs). Anything but an explicit false runs
    # it: when that job fails, its output is empty and this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.rust_inputs != 'false' }}
    runs-on: ubuntu-latest
    # Three sequential tiers, with headroom for a cold cache: the first tier
    # then compiles the vendored speech C++ tree before it can lint.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: rustup component add clippy
      # `speech` (CPU) is the widest feature set a plain runner can build:
      # speech-cuda needs nvcc and speech-vulkan the Vulkan SDK, and their
      # Rust surface is identical to `speech` (they only toggle native
      # backends). cpal needs the ALSA headers on Linux.
      - if: ${{ !env.LOCALCI }}
        run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - name: Install video assembler
        if: ${{ !env.LOCALCI }}
        run: bash scripts/install-ci-video-build-tools.sh
      - name: Blocking tier
        run: cargo clippy --locked --all-targets --features speech,trace-profiling -- -D warnings
      # `--features speech` so the unwrap/expect ban also covers the speech
      # runtime code.
      - name: Strict tier
        if: ${{ !cancelled() }}
        run: cargo clippy --locked --workspace --lib --bins --examples --features speech -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - name: Pedantic tier (advisory)
        if: ${{ !cancelled() }}
        run: |
          cargo clippy --locked --workspace --all-targets --features speech -- -D warnings -W clippy::pedantic || {
            echo "::warning::Pedantic lint debt detected (non-blocking advisory tier)."
          }

  rust-test:
    name: Tests (${{ matrix.name }} ${{ matrix.shard }})
    needs: changes
    # A pull request that changes only documentation or other workflows skips
    # this job (see Detect changed inputs). Anything but an explicit false runs
    # it: when that job fails, its output is empty and this job still runs.
    if: ${{ !cancelled() && needs.changes.outputs.rust_inputs != 'false' }}
    runs-on: ${{ matrix.os }}
    # Headroom for a cold cache. A lock bump, toolchain bump, or eviction
    # rebuilds the vendored speech C++ tree, and a job that times out skips
    # the cache save, so the next run starts cold again.
    # On Linux, ui, libs, and speech run as three jobs. They restore one cache
    # entry per OS; the key still includes this job id. Only the speech shard
    # saves, and a miss on main rebuilds the whole workspace there before the
    # speech feature.
    # macOS runs libs, then speech, as one `all` job, which saves its own
    # entry. GitHub-hosted accounts get about five concurrent macOS jobs, so
    # three per run kept pull requests queued for macOS runners. The speech
    # pass runs the horizon-ui tests, so `all` skips the plain ui pass; the
    # Linux ui job tests the build without speech.
    timeout-minutes: ${{ matrix.timeout_minutes || 35 }}
    # On a pull request that changes no speech input, horizon-ui included
    # (see Detect changed inputs), the Linux speech job skips its steps
    # instead of the whole job: a job-level `if` cannot read the matrix, and
    # a separate job would change the job id in the shared linux-test cache
    # key. Clippy still compiles the speech code on every pull request. A
    # push never skips, because this job saves the Linux cache on main. Only
    # an explicit false skips, so a failed detection still runs the tests.
    # Every step that this leg runs checks the flag; a new one must too
    # (Verify CI change detection checks this).
    env:
      HORIZON_CI_SKIP_SPEECH: ${{ github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.shard == 'speech' && needs.changes.outputs.speech_inputs == 'false' }}
    strategy:
    # A failing OS releases the other runner instead of holding it to the
    # full timeout; the cancelled sibling keeps its logs and a re-run
    # recovers the complete per-OS signal. See #677.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-test
            shard: ui
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-test
            shard: libs
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-test
            shard: speech
            save_cache: true
          - os: macos-latest
            name: macOS arm64
            cache_key: macos-test
            shard: all
            save_cache: true
            # libs and speech in sequence, with the same cold-cache headroom.
            timeout_minutes: 60
    steps:
      - name: Skip the speech tests
        if: env.HORIZON_CI_SKIP_SPEECH == 'true'
        shell: bash
        run: |
          echo "::notice::No speech inputs changed; the speech tests did not run."
          echo "Skipped: this pull request changes no speech input (see Detect changed inputs)." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7
        if: env.HORIZON_CI_SKIP_SPEECH != 'true'
        with:
          lfs: true
      - id: rust-cache
        if: env.HORIZON_CI_SKIP_SPEECH != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.save_cache == true }}
      - name: Report rust-cache status
        if: env.HORIZON_CI_SKIP_SPEECH != 'true'
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Link the Swift runtime in macOS test binaries
        if: startsWith(matrix.os, 'macos-')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,-rpath,/usr/lib/swift" >> "$GITHUB_ENV"
      - name: Install video assembler
        if: ${{ !env.LOCALCI && env.HORIZON_CI_SKIP_SPEECH != 'true' }}
        shell: bash
        run: bash scripts/install-ci-video-build-tools.sh
      # Speech links ALSA. The other shards do not build that feature.
      - if: ${{ !env.LOCALCI && matrix.os == 'ubuntu-latest' && matrix.shard == 'speech' && env.HORIZON_CI_SKIP_SPEECH != 'true' }}
        run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - if: ${{ !env.LOCALCI && matrix.os == 'ubuntu-latest' && matrix.shard == 'libs' }}
        run: bash scripts/install-ci-ubuntu-dependencies.sh tmux
      - name: Test shard
        if: env.HORIZON_CI_SKIP_SPEECH != 'true'
        shell: bash
        env:
          HORIZON_CI_SHARD: ${{ matrix.shard }}
          HORIZON_CI_CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: bash scripts/ci-cargo-test-shard.sh
      # horizon-chromecast and horizon-media are standalone libraries that also
      # target Apple mobile platforms; keep device and simulator builds compiling.
      - name: Cross-build portable casting crates for Apple mobile targets
        # Runs even when a test shard failed, so a test failure does not hide
        # this check.
        if: ${{ !cancelled() && startsWith(matrix.os, 'macos-') && matrix.shard == 'all' }}
        shell: bash
        # This job saves the macOS cache entry. A separate target directory keeps
        # the iOS builds and their host build scripts out of it.
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/apple-mobile-target
        run: |
          # A component download can fail on a network error, so try three times.
          for attempt in 1 2 3; do
            rustup target add aarch64-apple-ios aarch64-apple-ios-sim && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::rustup target add failed three times"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          for target in aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build --locked -p horizon-media --all-features --target "$target"
            cargo build --locked -p horizon-chromecast --target "$target"
            cargo build --locked -p horizon-chromecast --no-default-features --target "$target"
          done
      # The worker image scripts need util-linux flock and bash 4, so the
      # suite runs on the Linux libs shard only. That shard already built the
      # helper. A skipped test fails the step: the helper-gated contract tests
      # and the git-lfs hydration tests skip silently when a prerequisite is gone.
      # A local localci run only warns, because some tests need root, which a
      # runner has through passwordless sudo and a developer computer should not.
      - name: Cloud worker scripts
        if: matrix.os == 'ubuntu-latest' && matrix.shard == 'libs'
        shell: bash
        run: |
          cargo build --locked -p horizon-cloud-worker
          HORIZON_TEST_CLOUD_WORKER="$PWD/target/debug/horizon-cloud-worker" \
            python3 -B -m unittest discover -s examples/cloud-worker -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/cloud-worker-tests.log"
          if grep -q 'skipped=' "$RUNNER_TEMP/cloud-worker-tests.log"; then
            if [ -n "${LOCALCI:-}" ]; then
              echo "::warning::Cloud worker tests were skipped on this computer; GitHub CI runs them."
            else
              echo "::error::Cloud worker tests were skipped; install their prerequisites instead."
              exit 1
            fi
          fi

  snap-build:
    name: Snap Build
    needs: changes
    # Disabled: Snap packaging paused. Re-enable by restoring the previous
    # condition: needs.changes.outputs.run_snap_build == 'true'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: .
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: horizon-linux-x64.snap
          path: ${{ steps.snapcraft.outputs.snap }}

  # Docs/CI-only pushes to main must not pay for release builds, so this job
  # is gated on the paths that can change the binary, as detected by Detect
  # changed inputs. Linux builds for every such push. macOS builds
  # each night in macos-release-builds.yml, and here only when the push
  # changes how a release asset is built or packaged: GitHub-hosted accounts
  # get about five concurrent macOS jobs, and two macOS release builds on
  # every merge kept the macOS test job on main queued. A workflow dispatch
  # always builds every platform, even when Detect changed inputs fails, so a
  # release build can still be forced on demand.
  rust-artifacts:
    name: Artifacts
    if: always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.changes.outputs.release_inputs == 'true'))
    needs: changes
    uses: ./.github/workflows/release-artifacts.yml
    with:
      platforms: >-
        linux-x64
        ${{ (github.event_name == 'workflow_dispatch' || needs.changes.outputs.macos_release_inputs == 'true') && 'macos-arm64 macos-x64' || '' }}
