name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Cache policy: every rust-cache step below sets
# `save-if: github.ref == 'refs/heads/main'`. Pull-request runs restore from
# main's entry but never write their own. A per-branch copy of each build
# cache pushed the repository past GitHub's 10 GB budget, and the resulting
# eviction of the main entries left cold jobs to time out.
# Keys keep the default lock-aware suffix (do not set
# `add-rust-environment-hash-key: false`): GitHub cache entries are immutable,
# so a stable key freezes the entry at its first save and every later lock
# bump re-downloads its new dependencies on every run. A lock bump costs one
# cold build per lane until the next main run saves the new entry, which is
# the cheaper tradeoff here. The Report rust-cache status steps surface
# HIT/MISS from the action's cache-hit output in the job summary.
jobs:
  # The small ubuntu checks share one runner instead of seven parallel
  # one-job runners: each finishes in well under a minute, so the fan-out
  # mostly lengthens the GitHub-hosted queue. Keep new small checks here as
  # steps; give a check its own job only when it needs a different runner
  # or cache. See #677.
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run_snap_build: ${{ steps.snap-detect.outputs.run_snap_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0
      - name: Format
        run: |
          rustup component add rustfmt
          cargo fmt --all -- --check
      - name: Verify Ubuntu dependency installer
        run: python3 -B scripts/test_install_ci_ubuntu_dependencies.py -v
      - name: Verify GitHub release orchestration
        run: python3 -B scripts/test_release_github.py -v
      - name: Verify Surge dependency updates
        run: |
          python3 -B scripts/test_check_surge_dependency.py -v
          python3 -B scripts/check_surge_dependency.py
      - name: Maintainability
        run: ./scripts/check-maintainability.sh
      - name: Version Sync
        run: ./scripts/check-version-sync.sh
      - name: Browser client dependency boundary
        run: python3 scripts/check-browser-client-dependencies.py
      - id: snap-detect
        name: Detect Snap packaging changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run_snap_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "00000000000000000000000000000000000000" ]; then
            echo "run_snap_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_snap_build=false

          while IFS= read -r path; do
            case "$path" in
              .github/workflows/ci.yml|.github/workflows/release.yml|scripts/build-surge-toolchain.sh|scripts/package-release-asset.sh|scripts/stage-surge-artifacts.sh|snap/*|packaging/linux/*|assets/icons/*)
                run_snap_build=true
                break
                ;;
            esac
          done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "run_snap_build=$run_snap_build" >> "$GITHUB_OUTPUT"

  browser-engine:
    name: Browser engine (${{ matrix.features }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        features: [minimal, video-capture]
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: browser-engine-${{ matrix.features }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify dependency boundary
        run: python3 scripts/check-browser-engine-dependencies.py
      - name: Test remote click geometry
        run: node --test scripts/browser-smoke/remote_click_geometry.test.cjs
      - name: Test and lint standalone engine
        env:
          ENGINE_FEATURES: ${{ matrix.features }}
        run: |
          features=()
          if [ "$ENGINE_FEATURES" != minimal ]; then
            features=(--features "$ENGINE_FEATURES")
          fi
          cargo test --locked -p horizon-browser --no-default-features "${features[@]}"
          cargo clippy --locked -p horizon-browser --all-targets --no-default-features "${features[@]}" -- -D warnings

  device:
    name: Device library and CLI/MCP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: device
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: bash scripts/install-ci-ubuntu-dependencies.sh libxkbcommon-dev pkg-config xvfb xauth
      - run: cargo test --locked -p horizon-device
      - run: cargo test --locked -p horizon-device --features cli
      - run: cargo clippy --locked -p horizon-device --all-targets --features cli -- -D warnings -D clippy::unwrap_used -D clippy::expect_used
      - run: cargo package --locked -p horizon-device --features cli
      - name: Native input lifecycle
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24 -nolisten tcp -extension MIT-SHM' bash -eu -c '
            device_test_dir=$(mktemp -d)
            trap '\''rm -rf "$device_test_dir"'\'' EXIT
            printf '\''{"id":"ci-device","endpoint":{"kind":"local_x11","display":"%s"}}'\'' "$DISPLAY" > "$device_test_dir/target.json"
            HORIZON_DEVICE_TEST_TARGET="$device_test_dir/target.json" cargo test --locked -p horizon-device --features cli --test x11_live --test cli -- --ignored
          '

  browser-harness-tests:
    name: Browser harness tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify remote browser spike transport rules
        run: python3 -B -m unittest discover -s scripts/remote-browser-spike/tests -v


  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: rustup component add clippy
      # `speech` (CPU) is the widest feature set a plain runner can build:
      # speech-cuda needs nvcc and speech-vulkan the Vulkan SDK, and their
      # Rust surface is identical to `speech` (they only toggle native
      # backends). cpal needs the ALSA headers on Linux.
      - run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - run: cargo clippy --locked --all-targets --features speech,trace-profiling -- -D warnings

  clippy-strict:
    name: Clippy (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: rustup component add clippy
      # `--features speech` so the unwrap/expect ban also covers the speech
      # runtime code (needs the ALSA headers to build cpal on Linux).
      - run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - run: cargo clippy --locked --workspace --lib --bins --examples --features speech -- -D warnings -D clippy::unwrap_used -D clippy::expect_used

  clippy-pedantic:
    name: Clippy (pedantic — advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: rustup component add clippy
      - run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - name: Run pedantic audit (non-blocking)
        run: |
          cargo clippy --locked --workspace --all-targets --features speech -- -D warnings -W clippy::pedantic || {
            echo "::warning::Pedantic lint debt detected (non-blocking advisory job)."
          }

  rust-test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # Headroom for a cold cache: macOS x64 took 12 minutes of the old
    # 15 while building the whole workspace twice (default and speech).
    timeout-minutes: 25
    strategy:
    # A failing OS releases the other two runners instead of holding them
    # to the full timeout; cancelled siblings keep their logs and a re-run
    # recovers the complete per-OS signal. See #677.
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-test
          - os: macos-latest
            name: macOS arm64
            cache_key: macos-test
          - os: macos-15-intel
            name: macOS x64
            cache_key: macos-intel-test
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Link the Swift runtime in macOS test binaries
        if: startsWith(matrix.os, 'macos-')
        run: echo "RUSTFLAGS=${RUSTFLAGS} -C link-arg=-Wl,-rpath,/usr/lib/swift" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace
      # Speech tests (resampler, GGUF reader, shortcut matchers, engine
      # state machine) run on every OS in the matrix so the native audio
      # linkage (ALSA / CoreAudio) is exercised on each supported target;
      # the no-mic and real-model paths stay env-gated off.
      - if: matrix.os == 'ubuntu-latest'
        run: bash scripts/install-ci-ubuntu-dependencies.sh libasound2-dev pkg-config
      - run: cargo test --locked --workspace --features speech

  windows-smoke:
    name: Windows test build
    runs-on: windows-latest
    # Headroom for a cold cache: a cacheless run passed 15 minutes while
    # still compiling the vendored speech C++ tree, and a timed-out job
    # skips the cache save, so the next run starts cold again.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-test-build
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: cargo test --locked --workspace --no-run
      - name: Execute durable publication regression
        run: cargo test --locked -p horizon-browser-cli --test cli run_publishes_a_complete_relative_job_when_home_is_unset -- --exact
      # The speech feature is advertised on Windows too (WASAPI capture via
      # cpal); build it so a Windows-only break cannot pass CI. Compiling the
      # vendored C++ tree here is the point — tests are not run.
      - run: cargo test --locked --workspace --features speech --no-run


  snap-build:
    name: Snap Build
    needs: repo-checks
    # Disabled: Snap packaging paused. Re-enable by restoring the previous
    # condition: needs.repo-checks.outputs.run_snap_build == 'true'
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: snapcore/action-build@v1
        id: snapcraft
        with:
          path: .
      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: horizon-linux-x64.snap
          path: ${{ steps.snapcraft.outputs.snap }}

  # Docs/CI-only pushes to main must not pay for four release builds:
  # gate the Artifacts matrix on the paths that can change the binary.
  # workflow_dispatch always builds so a release can be forced on demand.
  release-changes:
    name: Release inputs changed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |-
            rust:
              - 'assets/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'scripts/package-release-asset.sh'
              - '.github/workflows/ci.yml'

  rust-artifacts:
    name: Artifacts (${{ matrix.name }})
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release-changes.outputs.rust == 'true')
    needs: release-changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x64
            cache_key: linux-artifacts
            release_asset: horizon-linux-x64.tar.gz
            binary_path: target/release/horizon
            asset_kind: tar
          - os: macos-latest
            name: macOS arm64
            cache_key: macos-artifacts
            release_asset: horizon-osx-arm64.tar.gz
            binary_path: target/release/horizon
            asset_kind: tar
          - os: macos-15-intel
            name: macOS x64
            cache_key: macos-intel-artifacts
            release_asset: horizon-osx-x64.tar.gz
            binary_path: target/release/horizon
            asset_kind: tar
          - os: windows-latest
            name: Windows x64
            cache_key: windows-artifacts
            release_asset: horizon-windows-x64.exe
            binary_path: target/release/horizon.exe
            asset_kind: file
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.cache_key }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Report rust-cache status
        shell: bash
        run: |
          if [ "${{ steps.rust-cache.outputs.cache-hit }}" = "true" ]; then
            echo "rust-cache: HIT ($(du -sh target 2>/dev/null | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "rust-cache: MISS - cold build (lock bump or eviction)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: cargo build --locked --release
      - name: Package release asset
        shell: bash
        run: |
          ./scripts/package-release-asset.sh \
            --binary "${{ matrix.binary_path }}" \
            --kind "${{ matrix.asset_kind }}" \
            --output "${{ matrix.release_asset }}"
      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.release_asset }}
          path: ${{ matrix.release_asset }}
