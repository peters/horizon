[package]
name = "horizon-frame-source"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A live picture session of a frame source program: its socket, its control messages and its frames for any UI"

[features]
# A connected session without a program, for the tests of a UI that uses it.
test-support = []

[lints]
workspace = true

[dependencies]
command-fds = "0.3.2"
horizon-vnc.workspace = true
rustix = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
rustix.workspace = true
serde_json.workspace = true
tempfile.workspace = true
