[package]
name = "horizon-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
exposure-firewall = []
exposure-ports = []
# JSON schemas for requirements that MCP tools accept.
schema = ["dep:schemars"]

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
ring.workspace = true
serde.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
serde_json.workspace = true
schemars = { workspace = true, optional = true }
ureq.workspace = true
unicode-general-category.workspace = true
time.workspace = true
zeroize.workspace = true
keyring-core.workspace = true
tempfile.workspace = true
uuid.workspace = true

[dev-dependencies]
# A synthetic 2048-bit RSA key for the GitHub App installation token tests: `ring`
# signs with an RSA key but cannot make one, and no private key belongs in the
# repository.
rsa = { workspace = true, features = ["getrandom"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true
