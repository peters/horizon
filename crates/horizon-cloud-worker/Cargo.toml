[package]
name = "horizon-cloud-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[features]
trusted-tcp-producer = ["dep:thiserror", "tokio/net", "tokio/io-util", "tokio/process", "tokio/sync"]
exposure-gate = ["horizon-cloud-protocol/exposure-gate", "dep:socket2", "dep:thiserror", "tokio/net", "tokio/io-util", "tokio/sync"]
protected-ingress = ["horizon-cloud-protocol/exposure-gate"]

[dependencies]
horizon-cloud-protocol.workspace = true
horizon-cloud = { path = "../horizon-cloud", features = ["schema"] }
horizon-browser = { workspace = true, features = ["video-capture"] }
horizon-browser-control.workspace = true
horizon-browser-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
base64.workspace = true
png.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["io-std", "rt-multi-thread"] }
zeroize.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror = { workspace = true, optional = true }
[dev-dependencies]
ring.workspace = true
horizon-browser = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["net", "pty", "termios", "event"] }
socket2 = { workspace = true, optional = true }
