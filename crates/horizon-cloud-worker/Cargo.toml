[package]
name = "horizon-cloud-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
[lints]
workspace = true
[dependencies]
horizon-cloud-protocol.workspace = true
horizon-cloud = { path = "../horizon-cloud", features = ["schema"] }
horizon-browser = { workspace = true, features = ["video-capture"] }
horizon-browser-control.workspace = true
horizon-browser-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
base64.workspace = true
png.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio = { workspace = true, features = ["io-std", "rt-multi-thread"] }
zeroize.workspace = true
sha2.workspace = true
tempfile.workspace = true
[dev-dependencies]
ring.workspace = true
horizon-browser = { workspace = true, features = ["test-support"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["net", "pty", "termios", "event"] }
