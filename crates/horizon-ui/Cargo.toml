[package]
name = "horizon-ui"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
trace-profiling = ["horizon-core/trace-profiling", "profiling/profile-with-tracing"]

[[bin]]
name = "horizon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
horizon-browser.workspace = true
horizon-browser-control.workspace = true
horizon-frame-source.workspace = true
horizon-vnc.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
horizon-browser-mcp.workspace = true
horizon-core.workspace = true
horizon-sync.workspace = true
zeroize.workspace = true
horizon-cursor.workspace = true
eframe.workspace = true
# `bytemuck` lets VNC pixels become a texture image without a copy.
egui = { workspace = true, features = ["bytemuck"] }
winit.workspace = true
# Pulls the backend feature set into eframe's transitive wgpu dependency.
wgpu.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
profiling.workspace = true
serde_json.workspace = true
libc.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
png.workspace = true
alacritty_terminal.workspace = true
egui_commonmark.workspace = true
arboard.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync"] }

[dev-dependencies]
horizon-browser = { workspace = true, features = ["test-support"] }
horizon-frame-source = { workspace = true, features = ["test-support"] }
horizon-vnc = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true
# The session board and lease files that the tests read are still YAML.
serde_yaml.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
wl-clipboard-rs.workspace = true
smithay-clipboard = "0.7.3"
horizon-wayland.workspace = true

zeroize.workspace = true
