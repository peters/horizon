[package]
name = "horizon-ui"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
default = ["cloud-workspaces"]
cloud-workspaces = ["horizon-core/cloud-workspaces"]
cloud-panel-mock = ["cloud-workspaces"]
trace-profiling = ["horizon-core/trace-profiling", "profiling/profile-with-tracing"]
# Opt-in speech input (mic button + push-to-talk hotkey). CPU-only inference
# by default; add one of the GPU variants below to compile a GPU backend in.
# Backend selection at runtime stays automatic with CPU fallback either way.
speech = ["dep:transcribe-cpp", "dep:cpal"]
cast-nvenc = ["horizon-cast/nvenc"]
speech-cuda = ["speech", "transcribe-cpp/cuda"]
speech-vulkan = ["speech", "transcribe-cpp/vulkan"]

[[bin]]
name = "horizon"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
horizon-app-host.workspace = true
horizon-browser.workspace = true
vnc.workspace = true
thiserror.workspace = true
horizon-browser-mcp.workspace = true
horizon-core.workspace = true
zeroize.workspace = true
horizon-cursor.workspace = true
eframe.workspace = true
egui.workspace = true
winit.workspace = true
# Pulls the backend feature set into eframe's transitive wgpu dependency.
wgpu.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
profiling.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
tempfile.workspace = true
png.workspace = true
alacritty_terminal.workspace = true
egui_commonmark.workspace = true
arboard.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "sync"] }
transcribe-cpp = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

[dev-dependencies]
horizon-browser = { workspace = true, features = ["test-support"] }
rusqlite.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb.workspace = true
wl-clipboard-rs.workspace = true
smithay-clipboard = "0.7.3"
horizon-wayland.workspace = true

horizon-cast.workspace = true
zeroize.workspace = true
