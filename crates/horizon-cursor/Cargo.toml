[package]
name = "horizon-cursor"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Platform cursor query, focused text injection, and global hotkeys for Horizon"
repository.workspace = true

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
x11rb = { version = "0.14", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
atspi.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
axuielement.workspace = true
core-graphics = "0.25"
global-hotkey.workspace = true
