[package]
name = "horizon-pty-tap"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A pass-through wrapper of a PTY whose reader reports the OSC 7501 program status of its program"

[lints]
workspace = true

[dependencies]
alacritty_terminal.workspace = true
# The vectorised byte search that skips the text between two escape sequences of a
# panel's output.
memchr.workspace = true
# The trait `EventedReadWrite` of `alacritty_terminal` names the `Poller`, `Event`
# and `PollMode` types of this crate, so the wrapper of that trait names them too.
polling.workspace = true
# The typed errors of the frame codec, in the form the rest of the workspace uses.
thiserror.workspace = true
# The non-destructive read of a socket at its end, which `UnixStream::peek` has not
# in a stable form. It reuses the version that the workspace already asks for.
rustix.workspace = true
