[package]
name = "horizon-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Private workspace TCP services over authenticated iroh endpoints"

[features]
default = []
tailnet-bridge = []

[dependencies]
iroh.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "signal", "fs"] }
serde.workspace = true
# Serialization for bounded wire messages and portable agent configuration.
serde_json.workspace = true
# Typed errors follow the workspace API standard; no crypto is implemented here.
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Effective UID checks protect private key/config/state files without unsafe code.
rustix.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Parse operator-facing relay TOML with the parser already used by the workspace.
toml_edit.workspace = true
# The upstream relay is used in isolated TCP-only data-plane tests, not shipped.
iroh-relay = { version = "1.3.0", default-features = false, features = ["server", "tls-ring"] }

[lints]
workspace = true
