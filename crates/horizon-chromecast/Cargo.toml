[package]
name = "horizon-chromecast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Google Cast sender: receiver discovery, Cast v2 control and live H.264 streaming"

[features]
default = ["discovery"]
# Multicast DNS browsing. Hosts that discover receivers through a platform
# service (for example Bonjour on iOS) can disable it.
discovery = ["horizon-media/discovery"]
# Feed the desktop `ffmpeg` encoder pipeline from horizon-media into a live cast.
encoder = ["horizon-media/encoder"]

[lints]
workspace = true

[dependencies]
horizon-media.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[[example]]
name = "chromecast"
required-features = ["discovery"]

[dev-dependencies]
rcgen.workspace = true
