[package]
name = "horizon-core"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
trace-profiling = ["profiling/profile-with-tracing"]

[lints]
workspace = true

[dependencies]
tempfile.workspace = true
base64.workspace = true
qrcodegen.workspace = true
horizon-browser = { workspace = true, features = ["video-capture"] }
horizon-browser-control.workspace = true
horizon-browser-protocol.workspace = true
horizon-browser-routines.workspace = true
thiserror.workspace = true
tracing.workspace = true
profiling.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
url.workspace = true
ureq.workspace = true
time.workspace = true
alacritty_terminal.workspace = true
horizon-terminal.workspace = true
rusqlite.workspace = true
libc.workspace = true
uuid.workspace = true
comrak = { version = "0.59", default-features = false }
git2.workspace = true
sha2.workspace = true
atomicwrites.workspace = true
zeroize.workspace = true
# One JPEG encoder for the picture that the driver of a browser host pushes:
# 47 to 111 KB per frame at quality 60 against 110 to 484 KB as PNG.
jpeg-encoder = "0.7.1"

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
rmcp.workspace = true
tokio = { workspace = true, features = ["io-std", "rt-multi-thread"] }
horizon-browser = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

