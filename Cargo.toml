[workspace]
resolver = "3"
members = [

    "crates/horizon-device",
    "crates/horizon-device-vnc",
    "crates/horizon-browser",
    "crates/horizon-browser-cli",
    "crates/horizon-browser-control",
    "crates/horizon-browser-mcp",
    "crates/horizon-browser-protocol",
    "crates/horizon-browser-routines",
    "crates/horizon-core",
    "crates/horizon-cursor",
    "crates/horizon-sync",
    "crates/horizon-terminal",
    "crates/horizon-ui",
    "crates/horizon-vnc",
    "crates/horizon-wayland",
    "vendor/smithay-clipboard",
]

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "GPU-accelerated terminal board — a visual workspace for managing multiple terminal sessions"
repository = "https://github.com/peters/horizon"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
struct_excessive_bools = "allow"
# Pedantic lint new in Clippy 1.99. The tests deliberately use
# `assert!(x.is_empty())`. Older Clippy reports the name as an unknown lint
# (E0602), which `-D warnings` does not make an error.
assert_is_empty = "allow"

[workspace.dependencies]
ring = "0.17.14"
# Licensed decoder fixes shared by the native viewer and optional resize adapter.
vnc = { package = "vnc-rs", git = "https://github.com/peters/vnc-rs.git", rev = "773ec2351241c80bbab88ffedae73f1972e0a4c1" }
# The live VNC session behind the native Device viewer, usable by any UI.
horizon-vnc = { path = "crates/horizon-vnc", version = "0.2.7" }
# The click targets and the search of a terminal grid, usable by any UI or server.
horizon-terminal = { path = "crates/horizon-terminal", version = "0.2.7" }
# Zero-copy views of VNC pixels as RGBA bytes and as egui colors.
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc", "must_cast"] }
horizon-browser = { path = "crates/horizon-browser", version = "0.2.7" }
horizon-browser-control = { path = "crates/horizon-browser-control", version = "0.2.7" }
horizon-browser-mcp = { path = "crates/horizon-browser-mcp", version = "0.2.7" }
horizon-browser-protocol = { path = "crates/horizon-browser-protocol", version = "0.2.7" }
horizon-browser-routines = { path = "crates/horizon-browser-routines", version = "0.2.7" }
horizon-core = { path = "crates/horizon-core", version = "0.2.7" }
# The store and the link protocol of one Horizon server, usable by a UI or a server.
horizon-sync = { path = "crates/horizon-sync", version = "0.2.7" }
horizon-cursor = { path = "crates/horizon-cursor", version = "0.2.7" }
horizon-wayland = { path = "crates/horizon-wayland", version = "0.2.7" }
thiserror = "2.0.20"
tracing = "0.1.44"
# A safe stop flag for `horizon --server` on SIGTERM and SIGINT. It reuses the
# version that alacritty_terminal already asks for, so no new package arrives.
signal-hook = "0.4.4"
# Chrome DevTools Protocol transport for browser panels. Plain ws:// to
# 127.0.0.1, so no TLS features are needed.
tungstenite = "0.30.0"
# JPEG decoder for CDP screencast frames (change-driven video stream).
zune-jpeg = "0.5.15"
png = "0.18.1"
# AV1 encoder for browser-panel WebM export, with runtime-dispatched SIMD.
# x86_64 video builds require NASM; encoding runs on a dedicated thread.
rav1e = { version = "0.8.1", default-features = false, features = ["asm", "threading"] }
base64 = "0.23.1"
# Selenium remote file transfer uses a one-file ZIP envelope.
zip = { version = "9.0.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
profiling = "1.0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
# Preserve user-owned Grok settings and detect MCP table collisions before registration.
toml_edit = "0.25.15"
url = "2.5.8"
keyring-core = "1.0.0"
zeroize = "1.9.0"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# Used by the macOS keychain adapter to classify locked-keychain OSStatus values.
security-framework = "3.7.0"
same-file = "1.0"
mime_guess = "2.0"
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
rmcp = { version = "3.5.0", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
alacritty_terminal = "0.26.0"
# `clipboard` is not in eframe's feature set when its defaults are off. Without it
# egui-winit keeps the clipboard inside the process, so no clipboard shortcut ever
# reads or writes the desktop clipboard.
eframe = { version = "0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.37.0"
# Feature-only dependency: eframe/egui-wgpu keep using wgpu 30, so Horizon must
# unify the native backend features here when eframe default features are disabled.
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "gles", "metal", "dx12"] }
egui_commonmark = { version = "0.26.0", default-features = false, features = ["pulldown_cmark"] }
winit = "0.30.13"
# XInput 2.4 supplies Linux trackpad pinch events missing from winit 0.30.
x11rb = { version = "0.14.0", features = ["xinput"] }
# PRIMARY selection over the Wayland data-control protocols, used before the X11 path
# arboard provides (arboard picks its Wayland backend by environment and never retries X11).
wl-clipboard-rs = "0.9.4"
# The pinch bridge adopts winit's `wl_display`, which needs libwayland itself:
# the pure-Rust backend cannot adopt a foreign display. `dlopen` matches winit.
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
# Test-only in-process compositor that drives the pinch bridge over a real
# Wayland socket.
wayland-server = "0.31.14"
tempfile = "3.27.0"
# Browser manifests need replace-existing semantics without exposing a gap to
# lock-free readers.
atomicwrites = "0.4.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["fs", "process"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
git2 = { version = "0.21", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
regex = "1.13.1"
arboard = "3.6.1"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }

[profile.release]
# Thin LTO: fat LTO's whole-program codegen dominated release builds
# (12m48s of the 13m28s macOS arm64 Artifacts job) for a desktop app where
# the extra optimization is not worth the CI cost. See #676.
lto = "thin"
strip = true

[profile.test]
# A test build is a debug build, and a test spends its time in work that a debug
# build leaves unoptimized: egui layout passes, deflate and base64 on a video
# frame, and one Ed25519 verification for every retained journal operation.
# Level 1 keeps the compile time of a test build close to the default; level 3 on
# the crates that do the cryptography is where the rest of the run time is.
#
# Measured over the whole workspace, 7146 tests, with the profile off, on and off
# again: 57.6, 48.1 and 57.6 minutes of test time. A full warm test build grew
# from 109 s to 168 s for that 9.5 minute saving. See
# docs/testing/reports/2026-10-24-test-suite-durations.md.
opt-level = 1

[profile.test.package.ring]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[patch.crates-io]
smithay-clipboard = { path = "vendor/smithay-clipboard" }
