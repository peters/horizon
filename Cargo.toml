[workspace]
resolver = "3"
members = [
    "crates/horizon-device",
    "crates/horizon-device-vnc",
    "crates/horizon-browser",
    "crates/horizon-browser-cli",
    "crates/horizon-browser-control",
    "crates/horizon-browser-mcp",
    "crates/horizon-browser-protocol",
    "crates/horizon-browser-routines",
    "crates/horizon-core",
    "crates/horizon-cursor",
    "crates/horizon-ui",
    "crates/horizon-wayland",
]

[workspace.package]
version = "0.2.7"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "GPU-accelerated terminal board — a visual workspace for managing multiple terminal sessions"
repository = "https://github.com/peters/horizon"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
struct_excessive_bools = "allow"

[workspace.dependencies]
# Licensed decoder fixes shared by the native viewer and optional resize adapter.
vnc = { package = "vnc-rs", git = "https://github.com/peters/vnc-rs.git", rev = "43848a7baa39f852beaf52b28eeb58f7d56ad669" }
horizon-browser = { path = "crates/horizon-browser", version = "0.2.7" }
horizon-browser-control = { path = "crates/horizon-browser-control", version = "0.2.7" }
horizon-browser-mcp = { path = "crates/horizon-browser-mcp", version = "0.2.7" }
horizon-browser-protocol = { path = "crates/horizon-browser-protocol", version = "0.2.7" }
horizon-browser-routines = { path = "crates/horizon-browser-routines", version = "0.2.7" }
horizon-core = { path = "crates/horizon-core", version = "0.2.7" }
horizon-cursor = { path = "crates/horizon-cursor", version = "0.2.7" }
horizon-wayland = { path = "crates/horizon-wayland", version = "0.2.7" }
thiserror = "2.0.20"
tracing = "0.1.44"
# Chrome DevTools Protocol transport for browser panels. Plain ws:// to
# 127.0.0.1, so no TLS features are needed.
tungstenite = "0.30.0"
# JPEG decoder for CDP screencast frames (change-driven video stream).
zune-jpeg = "0.5.15"
png = "0.18.1"
# Pure-Rust AV1 encoder for browser-panel WebM export. Assembly is left off so
# CI and developer machines do not need NASM; encoding runs on a dedicated thread.
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }
base64 = "0.23.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
profiling = "1.0.18"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"
serde_json = "1.0.151"
# Preserve user-owned Grok settings and detect MCP table collisions before registration.
toml_edit = "0.25.15"
url = "2.5.8"
keyring-core = "1.0.0"
zeroize = "1.9.0"
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }
# Used by the macOS keychain adapter to classify locked-keychain OSStatus values.
security-framework = "3.7.0"
windows-native-keyring-store = "1.1.0"
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
time = { version = "0.3.55", features = ["formatting", "parsing"] }
rmcp = { version = "3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
schemars = "1.2.2"
alacritty_terminal = "0.26.0"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
egui = "0.36.1"
# Feature-only dependency: eframe/egui-wgpu keep using wgpu 30, so Horizon must
# unify the native backend features here when eframe default features are disabled.
wgpu = { version = "30.0.0", default-features = false, features = ["std", "vulkan", "gles", "metal", "dx12"] }
egui_commonmark = { version = "0.25.0", default-features = false, features = ["pulldown_cmark"] }
winit = "0.30.13"
# XInput 2.4 supplies Linux trackpad pinch events missing from winit 0.30.
x11rb = { version = "0.14.0", features = ["xinput"] }
# The pinch bridge adopts winit's `wl_display`, which needs libwayland itself:
# the pure-Rust backend cannot adopt a foreign display. `dlopen` matches winit.
wayland-client = { version = "0.31.15", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32.13", features = ["client", "unstable"] }
tempfile = "3.27.0"
# Windows-only process-tree ownership for browser and WebDriver service
# descendants. The wrapper creates the child suspended, assigns it to a Job
# Object, then resumes it, avoiding PID-based teardown and assignment races.
process-wrap = { version = "10.0.0", default-features = false, features = ["std", "job-object"] }
# `std::fs::rename` cannot atomically replace an existing file on Windows.
# Browser manifests need replace-existing semantics without exposing a gap to
# lock-free readers.
atomicwrites = "0.4.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["fs", "process"] }
uuid = { version = "1.24.1", features = ["serde", "v4"] }
git2 = { version = "0.21", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
regex = "1.13.1"
arboard = "3.6.1"
atspi = { version = "0.30.0", default-features = false, features = ["connection", "proxies", "tokio", "zbus"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
axuielement = { version = "0.9.1", default-features = false, features = ["async"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSRunningApplication", "libc"] }
global-hotkey = "0.8.0"
# Speech input (opt-in `speech` feature): local ASR via transcribe.cpp. The
# -sys crate vendors the whole C++ tree, so cargo builds it from source —
# needs only CMake + a C++ compiler, no git submodules.
transcribe-cpp = "0.2.0"
# The `pulseaudio` feature (Linux-only effect) adds cpal's PulseAudio host, which
# `default_host()` prefers over raw ALSA when a PulseAudio/PipeWire (pipewire-pulse)
# server socket exists. Capture then shares the microphone with every other app
# (Discord, calls, ...) instead of failing with a busy raw-ALSA device; without a
# sound server it falls back to raw ALSA exactly as before.
cpal = { version = "0.18.2", features = ["pulseaudio"] }

[profile.release]
# Thin LTO: fat LTO's whole-program codegen dominated release builds
# (12m48s of the 13m28s macOS arm64 Artifacts job) for a desktop app where
# the extra optimization is not worth the CI cost. See #676.
lto = "thin"
strip = true

[profile.profiling]
inherits = "release"
debug = 1
strip = false
