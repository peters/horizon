<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project files — upload fixture</title>
<style>
body{font:16px system-ui;background:#f4f6fa;color:#1b2940;margin:0;padding:40px}main{max-width:720px;margin:auto}h1{font-size:32px;font-weight:650;margin:0 0 8px}p{color:#51617a;line-height:1.5}#drop-zone{background:white;border:2px dashed #9aafd1;border-radius:16px;padding:38px;margin:28px 0}#drop-zone.active{background:#e4edff;border-color:#416cce}button{font:inherit;border:0;border-radius:8px;padding:12px 18px;background:#365dcc;color:white;cursor:pointer}button.secondary{background:#e2e8f4;color:#304765;margin-left:10px}ul{padding:0;list-style:none}li{background:white;border-radius:8px;margin:8px 0;padding:14px}small{display:block;color:#586980;margin-top:4px}#result{white-space:pre-wrap;font:13px monospace}iframe{width:100%;height:200px;border:0}
</style>
<main>
<h1>Project files</h1>
<p>Synthetic upload fixture. Files stay in this page.</p>
<section id="drop-zone"><h2>Drop your files here</h2><p>Attach a report, an image, or a text file.</p>
<button id="choose" onclick="document.querySelector('#files').click()">Choose files</button>
<button class="secondary" id="choose-single" onclick="document.querySelector('#single').click()">Choose one PDF</button>
<input hidden type="file" id="files" multiple accept=".pdf,.txt,image/*">
<input hidden type="file" id="single" accept=".pdf">
</section>
<h2>Attached files</h2><p id="empty">No files attached yet</p><ul id="attachments"></ul><pre id="result"></pre>
</main>
<script>
const zone=document.querySelector('#drop-zone');
window.uploads=[];
async function showFiles(files,source){
 const list=document.querySelector('#attachments');list.replaceChildren();
 const values=await Promise.all(Array.from(files,async file=>{
  const bytes=new Uint8Array(await file.arrayBuffer());
  const item=document.createElement('li');item.textContent=file.name;
  const detail=document.createElement('small');detail.textContent=`${file.size} bytes · ${source}`;item.append(detail);list.append(item);
  return{name:file.name,size:file.size,firstByte:bytes[0]??null,lastByte:bytes.at(-1)??null,source};
 }));
 window.uploads=values;document.querySelector('#empty').hidden=values.length>0;
 document.querySelector('#result').textContent=JSON.stringify(values,null,2);
}
for(const id of ['files','single'])document.querySelector('#'+id).addEventListener('change',event=>showFiles(event.target.files,'File picker'));
for(const kind of ['dragenter','dragover'])zone.addEventListener(kind,event=>{event.preventDefault();zone.classList.add('active')});
zone.addEventListener('dragleave',()=>zone.classList.remove('active'));
zone.addEventListener('drop',event=>{event.preventDefault();zone.classList.remove('active');showFiles(event.dataTransfer.files,'Drag and drop')});
const frameMode=new URLSearchParams(location.search).get('frame');
if(frameMode==='same'||frameMode==='cross'){
 const frame=document.createElement('iframe');frame.id='drop-frame';frame.style.height='280px';
 if(frameMode==='cross')frame.setAttribute('sandbox','allow-scripts');
 const label=frameMode==='same'?'Same-origin frame':'Cross-origin sandbox frame';
 frame.srcdoc=`<!doctype html><html><meta charset="utf-8"><style>body{font:18px system-ui;margin:0;background:#e4edff;color:#1b2940}#zone{box-sizing:border-box;min-height:260px;padding:24px;border:2px dashed #365dcc}pre{white-space:pre-wrap}</style><div id="zone"><h2>${label}</h2><p>Drop a synthetic file here.</p><pre id="result"></pre></div><script>
 const zone=document.querySelector('#zone');
 zone.addEventListener('dragover',event=>event.preventDefault());
 zone.addEventListener('drop',async event=>{event.preventDefault();const files=await Promise.all(Array.from(event.dataTransfer.files,async file=>{const bytes=new Uint8Array(await file.arrayBuffer());return{name:file.name,size:file.size,firstByte:bytes[0]??null,lastByte:bytes.at(-1)??null,source:'${label}'}}));document.querySelector('#result').textContent=JSON.stringify(files,null,2);parent.postMessage({fixture:'upload-frame',files},'*')});
 <\/script></html>`;
 zone.replaceChildren(frame);
 window.addEventListener('message',event=>{
  if(event.source!==frame.contentWindow||event.data?.fixture!=='upload-frame')return;
  window.uploads=event.data.files;document.querySelector('#empty').hidden=window.uploads.length>0;
  document.querySelector('#result').textContent=JSON.stringify(window.uploads,null,2);
 });
}
</script>
</html>
