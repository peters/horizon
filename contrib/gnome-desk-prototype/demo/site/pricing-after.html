<!doctype html><html><head><meta http-equiv="refresh" content="2"><meta charset="utf-8"><title>Pricing</title><style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#e8eefc}
.wrap{padding:28px 32px}h1{margin:0 0 6px;font-size:26px}p.sub{margin:0 0 22px;color:#9fb0d4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{border:1px solid #26324f;border-radius:14px;padding:18px;background:#10182c}
.card.hot{border-color:#6a90ff;box-shadow:0 0 0 3px rgba(106,144,255,.12)}
.name{color:#9fb0d4;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.price{font-size:34px;font-weight:700;margin:8px 0}.price small{font-size:14px;color:#9fb0d4;font-weight:400}
ul{padding-left:18px;color:#c5d1ec;font-size:14px;line-height:1.7}
.badge{display:inline-block;margin-top:12px;font-size:12px;color:#7fe0a8;border:1px solid #2c6a4c;border-radius:999px;padding:3px 10px}
</style></head><body><div class="wrap"><h1>Simple pricing</h1><p class="sub">Three plans. Save 25% when you pay annually.</p>
<div class="grid">
<div class="card"><div class="name">Starter</div><div class="price">$9<small>/mo</small></div><ul><li>1 workspace</li><li>Community support</li></ul></div>
<div class="card hot"><div class="name">Team</div><div class="price">$24<small>/mo</small></div><ul><li>Unlimited workspaces</li><li>Shared agents</li><li>Priority support</li><li>Annual billing</li></ul><span class="badge">Save 25% yearly</span></div>
<div class="card"><div class="name">Scale</div><div class="price">$99<small>/mo</small></div><ul><li>Cloud environments</li><li>SSO</li><li>Audit log</li></ul></div>
</div></div></body></html>
