<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon Browser Smoke - WebSocket Stream</title>
  <style>
    body { background: #111827; color: #e5e7eb; font: 18px system-ui, sans-serif; margin: 3rem; }
    #stream-status { border: 2px solid #38bdf8; border-radius: 12px; padding: 1.5rem; }
  </style>
</head>
<body>
  <h1>WebSocket capture fixture</h1>
  <p id="stream-status" data-state="connecting">connecting</p>
  <script>
    const status = document.querySelector('#stream-status');
    let received = 0;
    const socket = new WebSocket(`ws://${location.host}/market-stream?token=MCP_NETWORK_URL_SECRET`);
    socket.addEventListener('open', () => {
      status.dataset.state = 'open';
      status.textContent = 'open';
      socket.send(JSON.stringify({ action: 'subscribe', symbols: ['TEST'] }));
    });
    socket.addEventListener('message', (event) => {
      received += 1;
      if (received === 1 || received % 256 === 0) {
        const value = JSON.parse(event.data);
        status.textContent = `open received=${received} last=${value.sequence}`;
      }
    });
    socket.addEventListener('close', () => {
      status.dataset.state = 'closed';
      status.textContent = `closed received=${received}`;
    });
    socket.addEventListener('error', () => {
      status.dataset.state = 'error';
      status.textContent = `error received=${received}`;
    });
  </script>
</body>
</html>
